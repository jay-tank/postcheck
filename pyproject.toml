[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "postcheck"
version = "0.1.0"
description = "Check an incident postmortem doc for required sections and complete action items — deterministic first, optional AI content-quality review."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Tank", email = "tankjai24@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["rich>=13.0"]
keywords = ["cli", "incident", "postmortem", "sre", "devops", "ai", "llm", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
postcheck = "cli:main"

[project.urls]
Homepage = "https://github.com/jay-tank/postcheck"
Repository = "https://github.com/jay-tank/postcheck"
Issues = "https://github.com/jay-tank/postcheck/issues"

[tool.setuptools]
py-modules = ["cli", "models", "rules", "prompt", "render"]

[tool.setuptools.packages.find]
include = ["providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
